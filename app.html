.hero>*{position:relative;z-index:1}
.hero p{opacity:.85}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.g2.solo{grid-template-columns:1fr}}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.stat .k{font-size:13px;color:var(--mute)}
.stat .v{font-family:var(--kufi);font-size:24px;font-weight:800;color:var(--teal);line-height:1.3}
.stat .s{font-size:12.5px;color:var(--mute)}
.bar{height:8px;background:var(--linen);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sand));border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.b-teal{background:var(--teal);color:var(--cream)}
.b-sand{background:var(--sand);color:var(--deep)}
.b-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b-wa{background:#25D366;color:#fff}
.b-ghost{background:var(--linen);color:var(--deep)}
.b-sm{padding:7px 11px;font-size:13.5px;border-radius:11px}
.b-bad{background:#fbebeb;color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--linen);color:var(--deep);white-space:nowrap}
.c-ok{background:#e5f4e4;color:var(--ok)}.c-warn{background:#f9eeda;color:var(--warn)}.c-bad{background:#fbebeb;color:var(--bad)}.c-teal{background:#e3efed;color:var(--teal)}
.list{display:grid;gap:10px}
.item{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.item .t{font-weight:700;font-size:16px}
.item .m{color:var(--mute);font-size:13.5px}
.item .acts{margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:62px;background:var(--cream);z-index:10}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--mute);white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--teal);color:var(--cream)}
.tabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--sand);color:var(--deep);font-size:12px;margin-inline-start:6px;padding:0 5px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:700;color:var(--deep)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:15.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;background:#fff}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--cream)}
.seg label:has(input:checked){background:var(--teal);border-color:var(--teal);color:var(--cream)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:30px;line-height:1;color:#d9cfbb;cursor:pointer;padding:0 2px}
.stars button.on{color:var(--sand)}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.sheet{position:fixed;inset:0;background:rgba(13,63,60,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet .box{background:var(--cream);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:24px}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.x{border:0;background:var(--linen);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--cream);padding:11px 18px;border-radius:14px;z-index:80;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:92vw}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.load{display:grid;place-items:center;min-height:50vh;color:var(--mute)}
.spin{width:34px;height:34px;border:3px solid var(--linen);border-top-color:var(--teal);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.qmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.qmap div{border-radius:10px;padding:6px 4px;text-align:center;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:12px;line-height:1.35;min-height:46px}
.qmap div b{display:block;font-size:10.5px;color:var(--mute);font-weight:500}
.qmap .done{background:var(--teal);color:var(--cream);box-shadow:none}
.qmap .done b{color:rgba(251,246,236,.7)}
.qmap .cur{background:#fff6e3;box-shadow:inset 0 0 0 2px var(--sand)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:8px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.rep{border-right:3px solid var(--sand);padding:12px 14px;background:#fff;border-radius:14px}
.rep .d{font-size:13px;color:var(--mute)}
.rep .l{margin-top:4px}
.rep .stars-s{color:var(--sand);letter-spacing:2px}
.muted{color:var(--mute)}
.small{font-size:13.5px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;background:#fff;margin-bottom:12px;font-size:15.5px}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}
table.t th,table.t td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:14.5px}
table.t th{background:var(--linen);font-family:var(--kufi);font-size:13px}
.home{max-width:520px;margin:0 auto;text-align:center;padding:40px 18px}
.home .lg{height:120px;width:auto;margin:0 auto 18px;display:block}
audio{width:100%;margin-top:8px}
.ans{display:grid;gap:4px;margin-top:8px;font-size:14px}
.ans div{display:flex;gap:8px}.ans span:first-child{color:var(--mute);min-width:120px}
@media print{.top,.tabs,.acts,.btn{display:none!important}body{background:#fff}}

function sessionForm(st,action,done,extra={}){
  const last=st.last||{};const ls=+last.surah||'';
  const opts=SUR.n.map((n,i)=>`<option value="${i+1}" ${ls===i+1?'selected':''}>${i+1}. ${esc(n)}</option>`).join('');
  sheet('حصة '+st.name,`<form id="sf">
  <div class="field"><label>التاريخ</label><input type="date" name="date" value="${today()}" required></div>
  <div class="field"><label>الحضور</label><div class="seg">${Object.entries(ST).map(([k,v],i)=>`<label><input type="radio" name="status" value="${k}" ${i===0?'checked':''}><span>${v[0]}</span></label>`).join('')}</div></div>
  <div id="pres">
  <div class="field"><label>الحفظ الجديد</label><div class="f3"><select name="surah"><option value="">— بدون حفظ جديد —</option>${opts}</select><input type="number" name="fromAyah" min="1" placeholder="من آية" inputmode="numeric"><input type="number" name="toAyah" min="1" placeholder="إلى آية" inputmode="numeric"></div><div class="small muted" id="ayc"></div></div>
  <label class="chk"><input type="checkbox" name="completedSurah"> أتمّ الطالب حفظ هذه السورة</label>
  <div class="field"><label>المراجعة</label><input name="revision" placeholder="مثال: سورة النبأ كاملة"></div>
  <div class="field"><label>التقييم</label><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} من 5">★</button>`).join('')}</div><input type="hidden" name="rating" value="0"></div>
  <div class="field"><label>الواجب</label><input name="homework" placeholder="ما يراجعه قبل الحصة القادمة"></div>
  </div>
  <div class="field"><label>ملاحظة لولي الأمر</label><textarea name="note" placeholder="ابدأ بما أجاده الطالب، ثم ما يحتاج تمريناً"></textarea></div>
  <button class="btn b-teal" style="width:100%" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> حفظ التقرير</button></form>`,(box,close)=>{
    const f=$('#sf',box),pres=$('#pres',box),ayc=$('#ayc',box);
    const upd=()=>{pres.style.display=f.status.value==='present'?'':'none'};
    $$('input[name=status]',box).forEach(r=>r.onchange=upd);
    const sc=()=>{const n=+f.surah.value;ayc.textContent=n?'عدد آيات السورة: '+SUR.c[n-1]:'';f.fromAyah.max=f.toAyah.max=n?SUR.c[n-1]:286};
    f.surah.onchange=sc;sc();
    if(ls&&last.toAyah&&!last.completedSurah){f.fromAyah.value=Math.min(+last.toAyah+1,SUR.c[ls-1])}
    $$('#stars button',box).forEach(b=>b.onclick=()=>{f.rating.value=b.dataset.n;$$('#stars button',box).forEach(x=>x.classList.toggle('on',+x.dataset.n<=+b.dataset.n))});
    f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='جارٍ الحفظ…';
      const data=Object.assign({studentId:st.id,date:f.date.value,status:f.status.value},extra);
      if(data.status==='present'){Object.assign(data,{surah:f.surah.value,fromAyah:f.fromAyah.value,toAyah:f.toAyah.value,completedSurah:f.completedSurah.checked,revision:f.revision.value,rating:f.rating.value,homework:f.homework.value})}
      data.note=f.note.value;
      try{await api(action,{data});close();toast('تم حفظ التقرير ✓');done&&done()}catch(err){btn.disabled=false;btn.textContent='حفظ التقرير';toast('تعذّر الحفظ، حاول مرة أخرى')}};
  });
}

  p.innerHTML=`<div class="list">${DB.apps.map(a=>{let ans=[];try{ans=JSON.parse(a.answers)}catch(e){}return `<div class="item"><div class="row"><span class="t">${esc(a.name)}</span><span class="chip ${a.status==='جديد'?'c-warn':a.status==='مقبول'?'c-ok':''}">${esc(a.status)}</span><span class="small muted">${esc(day(a.createdAt.slice(0,10)))}${a.country?' · '+esc(a.country):''}</span></div>
  ${a.audioUrl?`<audio controls preload="none" src="${esc(a.audioUrl)}"></audio>`:'<div class="small muted mt">لم يصل تسجيل صوتي.</div>'}
  <details class="mt"><summary class="small" style="cursor:pointer;font-weight:700">الإجابات</summary><div class="ans">${ans.map(([l,v])=>`<div><span>${esc(l)}</span><span>${esc(v)}</span></div>`).join('')}</div></details>
  <div class="acts row"><a class="btn b-wa b-sm" target="_blank" rel="noopener" href="${waLink(a.phone,`وعليكم السلام ${a.name}، شكراً لتقديمك في أكاديمية حروف من نور. استمعنا لتلاوتك ونود تحديد موعد مقابلة قصيرة (20 دقيقة). ما الوقت المناسب لك؟`)}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg> دعوة للمقابلة</a>
  <select data-as="${esc(a.id)}" style="border:1.5px solid var(--line);border-radius:11px;padding:6px">${['جديد','مقابلة','مقبول','مرفوض'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select>
  ${a.status==='مقبول'?`<button class="btn b-teal b-sm" data-mk="${esc(a.id)}">إضافته كمعلم</button>`:''}</div></div>`}).join('')||'<div class="empty">ستصل هنا طلبات المعلمين من صفحة «انضم كمعلم» مع تسجيلاتهم.</div>'}</div>`;
  $$('[data-as]',p).forEach(s=>s.onchange=async()=>{try{await api('setAppStatus',{id:s.dataset.as,status:s.value});DB.apps.find(a=>a.id===s.dataset.as).status=s.value;toast('تم ✓');aApps(p)}catch(e){toast('تعذّر')}});
  $$('[data-mk]',p).forEach(b=>b.onclick=()=>{const a=DB.apps.find(x=>x.id===b.dataset.mk);let g='';try{g=(JSON.parse(a.answers).find(x=>x[0]==='الصفة')||[])[1]||''}catch(e){}teacherForm({name:a.name,phone:a.phone,gender:g})});
}

function aSettings(p){
  p.innerHTML=`<div class="card"><h3>روابط مهمة</h3><p class="small muted mt">رابط لوحة الإدارة (لك ولزميلك فقط):</p><div class="row mt"><span class="latin small" style="word-break:break-all">${esc(base()+'#admin')}</span><button class="btn b-ghost b-sm" id="cpa">نسخ</button></div>
  <p class="small muted mt">ثبّت التطبيق على الهاتف: افتح الرابط ثم «إضافة إلى الشاشة الرئيسية».</p></div>
  <div class="card mt"><h3>تغيير كلمة سر الإدارة</h3><form id="kf" class="mt"><div class="field"><label>كلمة السر الجديدة (8 أحرف على الأقل)</label><input type="password" name="k" minlength="8" required autocomplete="new-password"></div><button class="btn b-teal">تغيير</button></form></div>
  <div class="card mt"><h3>قاعدة الحساب</h3><p class="small mt">نصيب المعلم ${Math.round(DB.settings.share*100)}% من سعر الحصة في باقة الطالب، بحد أدنى <span class="latin">${money(DB.settings.floor)}</span> للحصة، عن كل حصة حضرها الطالب أو غاب عنها دون إشعار.</p></div>`;
  $('#cpa').onclick=()=>copy(base()+'#admin');
  $('#kf').onsubmit=async e=>{e.preventDefault();const k=e.target.k.value;try{await api('changeKey',{newKey:k});store.set('hn_k',k);memK=k;auth={k};toast('تم تغيير كلمة السر ✓');e.target.reset()}catch(err){toast('تعذّر التغيير')}};
}

function route(){
  let h=location.hash.slice(1);
  if(h.startsWith('p=')||h.startsWith('t='))store.set('hn_last',h);
  else if(!h&&store.get('hn_last')){h=store.get('hn_last');history.replaceState(null,'','#'+h)}
  if(h.startsWith('p='))return parent(h.slice(2));
  if(h.startsWith('t='))return teacher(h.slice(2));
  if(h==='admin')return admin();
  home();
}
addEventListener('hashchange',route);route();
