.hero>*{position:relative;z-index:1}
.hero p{opacity:.85}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.g2.solo{grid-template-columns:1fr}}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.stat .k{font-size:13px;color:var(--mute)}
.stat .v{font-family:var(--kufi);font-size:24px;font-weight:800;color:var(--teal);line-height:1.3}
.stat .s{font-size:12.5px;color:var(--mute)}
.bar{height:8px;background:var(--linen);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sand));border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.b-teal{background:var(--teal);color:var(--cream)}
.b-sand{background:var(--sand);color:var(--deep)}
.b-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b-wa{background:#25D366;color:#fff}
.b-ghost{background:var(--linen);color:var(--deep)}
.b-sm{padding:7px 11px;font-size:13.5px;border-radius:11px}
.b-bad{background:#fbebeb;color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--linen);color:var(--deep);white-space:nowrap}
.c-ok{background:#e5f4e4;color:var(--ok)}.c-warn{background:#f9eeda;color:var(--warn)}.c-bad{background:#fbebeb;color:var(--bad)}.c-teal{background:#e3efed;color:var(--teal)}
.list{display:grid;gap:10px}
.item{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.item .t{font-weight:700;font-size:16px}
.item .m{color:var(--mute);font-size:13.5px}
.item .acts{margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:62px;background:var(--cream);z-index:10}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--mute);white-space:nowrap;cursor:pointer}

.stars{display:flex;gap:4px}

.empty{text-align:center;color:var(--mute);padding:26px 10px}

function sheet(title,html,onMount){
  const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="box" role="dialog" aria-modal="true"><div class="hd"><h3>${esc(title)}</h3><button class="x" aria-label="إغلاق">×</button></div>${html}</div>`;
  const close=()=>{s.remove();document.body.style.overflow=''};
  s.addEventListener('click',e=>{if(e.target===s||e.target.closest('.x'))close()});
  document.body.appendChild(s);document.body.style.overflow='hidden';
  onMount&&onMount(s.querySelector('.box'),close);return close;
}

/* memorized surahs from "78-114, 1" + completed sessions */
function memSet(mem,sessions){
  const set=new Set();
  String(mem||'').split(/[,،\s]+/).forEach(p=>{const m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)return;let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];for(let i=Math.max(1,a);i<=Math.min(114,b);i++)set.add(i)});
  (sessions||[]).forEach(s=>{if(s.completedSurah&&+s.surah)set.add(+s.surah)});
  return set;
}
function repHTML(s,extra=''){

}

بِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"مسلم، 4/ 2088، برقم 2723.","y":2},{"t":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"الترمذي، 5/ 466، برقم 3391، وانظر: صحيح الترمذي 3/142.","y":1},{"t":"اللَّهمَّ بِكَ أمسَينا وبِكَ أصبَحنا وبِكَ نَحيا وبِكَ نموتُ، وإليكَ المصيرُ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"الترمذي، 5/ 466، برقم 3391، وانظر: صحيح الترمذي 3/142.","y":2},{"t":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"وَمَنْ قَالَهَا مِنَ النَّهَارِ مُوقِنًا بِهَا، فَمَاتَ مِنْ يَوْمِهِ قَبْلَ أَنْ يُمْسِيَ، فَهُوَ مِنْ أَهْلِ الْجَنَّةِ، وَمَنْ قَالَهَا مِنَ اللَّيْلِ وَهُوَ مُوقِنٌ بِهَا، فَمَاتَ قَبْلَ أَنْ يُصْبِحَ، فَهُوَ مِنْ أَهْلِ الْجَنَّةِ","s":"أخرجه البخاري، 7/ 150، برقم 6306.","y":0},{"t":"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ","c":4,"cd":"أَربَعُ مَرَّاتٍ","f":"من قالها حين يصبح، أو يمسي أربع مرات، أعتقه اللَّه من النار","s":"أخرجه أبو داود، 4/ 317، برقم 5069، والبخاري في الأدب المفرد، برقم 1201، والنسائي في عمل اليوم والليلة، برقم 9، وابن السني، برقم 70، وحسّن سماحة الشيخ ابن باز ‘ إسناد النسائي، وأبي داود، في تحفة الأخيار، ص23.","y":1},{"t":"اللَّهم إني أمسيت أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ","c":4,"cd":"أَربَعُ مَرَّاتٍ","f":"من قالها حين يصبح، أو يمسي أربع مرات، أعتقه اللَّه من النار","s":"أخرجه أبو داود، 4/ 317، برقم 5069، والبخاري في الأدب المفرد، برقم 1201، والنسائي في عمل اليوم والليلة، برقم 9، وابن السني، برقم 70، وحسّن سماحة الشيخ ابن باز ‘ إسناد النسائي، وأبي داود، في تحفة الأخيار، ص23.","y":2},{"t":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"من قالها حين يصبح فقد أدَّى شكر يومه، ومن قالها حين يمسي فقد أدَّى شكر ليلته","s":"أخرجه أبو داود، 4/ 318، برقم 5073، والنسائي في عمل اليوم والليلة، برقم 7، وابن السني، برقم 41، وابن حبان، ((موارد)) برقم 2361، وحسّن ابن باز ‘ إسناده في تحفة الأخيار، ص24.","y":1},{"t":"اللَّهم ما أمسى بي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"من قالها حين يصبح فقد أدَّى شكر يومه، ومن قالها حين يمسي فقد أدَّى شكر ليلته","s":"أخرجه أبو داود، 4/ 318، برقم 5073، والنسائي في عمل اليوم والليلة، برقم 7، وابن السني، برقم 41، وابن حبان، ((موارد)) برقم 2361، وحسّن ابن باز ‘ إسناده في تحفة الأخيار، ص24.","y":2},{"t":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ، لاَ إِلَهَ إِلاَّ أَنْتَ","c":3,"cd":"ثَلَاثُ مَرَّاتٍ","f":"","s":"أبو داود، 4/ 324، برقم 5090، وأحمد، 5/ 42، برقم 20430، والنسائي في عمل اليوم والليلة، برقم 22، وابن السني، برقم 69، والبخاري في الأدب المفرد، برقم 701، وحسّن العلامة ابن باز ‘ إسناده في تحفة الأخيار، ص26.","y":0},{"t":"حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","c":7,"cd":"سَبعُ مَرَّاتٍ","f":"من قالها حين يصبح وحين يمسي سبع مرات كفاه اللَّه ما أهمّه من أمر الدنيا والآخرة","s":"أخرجه ابن السني، برقم 71 مرفوعاً، وأبو داود موقوفاً، 4/ 321، برقم 5081، وصحّح إسناده شعيب وعبدالقادر الأرناؤوط. انظر: زاد المعاد 2/376.","y":0},{"t":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ: فِي دِينِي وَدُنْيَايَ وَأَهْلِي، وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَينِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"أبو داود، برقم 5074، وابن ماجه، برقم 3871، وانظر: صحيح ابن ماجه، 2/332.","y":0},{"t":"اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطانِ وَشَرَكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"الترمذي، برقم 3392، وأبو داود، برقم 5067،. وانظر: صحيح الترمذي، 3/142.","y":0},{"t":"بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلاَ فِي السّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","c":3,"cd":"ثَلَاثُ مَرَّاتٍ","f":"من قالها ثلاثاً إذا أصبح، وثلاثاً إذا أمسى لم يضره شيء","s":"أخرجه أبو داود، 4/ 323، برقم، 5088، والترمذي، 5/ 465، برقم 3388، وابن ماجه، برقم 3869، وأحمد، برقم 446. وانظر: صحيح ابن ماجه، 2/332، وحسّن إسناده العلامة ابن باز ‘ في تحفة الأخيار، ص39.","y":0},{"t":"رَضِيتُ بِاللَّهِ رَبَّاً، وَبِالْإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ ﷺ نَبِيًّا","c":3,"cd":"ثَلَاثُ مَرَّاتٍ","f":"من قالها ثلاثاً حين يصبح وثلاثاً حين يمسي كان حقاً على اللَّه أن يرضيه يوم القيامة","s":"أحمد، 4/ 337، برقم 18967، والنسائي في عمل اليوم والليلة، برقم 4، وابن السني، برقم 68، وأبو داود، 4/ 318، برقم 1531، والترمذي، 5/ 465، برقم، 3389، وحسّنه ابن باز ‘ في تحفة الأخيار ص39.","y":0},{"t":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغيثُ أَصْلِحْ لِي شَأْنِيَ كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"الحاكم وصححه، ووافقه الذهبي، 1/545، وانظر: صحيح الترغيب والترهيب، 1/273. function streakInfo(practice,today){
  const set=new Set(practice.filter(p=>p.kind==='wird').map(p=>p.date));
  let n=0,d=new Date(today+'T12:00:00Z');if(!set.has(today))d.setUTCDate(d.getUTCDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setUTCDate(d.getUTCDate()-1)}
  const last14=[];for(let i=13;i>=0;i--){const x=new Date(today+'T12:00:00Z');x.setUTCDate(x.getUTCDate()-i);const k=x.toISOString().slice(0,10);last14.push([k,set.has(k)])}

async function teacher(tok){

  $('#who').textContent=d.teacher.name;
  const mine=d.sessions;
  app.innerHTML=`<div class="wrap">
  <section class="hero"><p class="small">السلام عليكم</p><h1>${esc(d.teacher.name)}</h1><p class="small mt">سجّل تقرير كل حصة بعد انتهائها مباشرة، فيراه ولي الأمر فوراً.</p></section>

  ${d.students.some(s=>s.days&&s.time)?`<div class="row mt"><button class="btn b-ghost b-sm" id="tics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg> أضف مواعيد حصصي إلى التقويم</button></div>`:''}
  ${(d.recitations||[]).length?`<h2>تسجيلات الطلاب (${d.recitations.filter(r=>!r.heard).length} جديد)</h2><div class="list">${d.recitations.map(r=>{const st=d.students.find(s=>s.id===r.studentId);return `<div class="item"><div class="row"><span class="t">${esc(st?st.name:'')}</span>${r.surah?`<span class="chip c-teal">سورة ${esc(sName(+r.surah))}</span>`:''}<span class="small muted">${esc(day(r.createdAt.slice(0,10)))}</span>${r.heard?'<span class="chip c-ok">سمعتها ✓</span>':''}</div>${r.note?`<div class="small mt">${esc(r.note)}</div>`:''}<audio controls preload="none" src="${esc(r.audioUrl)}"></audio>${r.heard?(r.feedback?`<div class="small muted mt">ملاحظتك: ${esc(r.feedback)}</div>`:''):`<div class="row mt"><input class="search" style="margin:0;flex:1" data-fb="${esc(r.id)}" placeholder="ملاحظة قصيرة للطالب"><button class="btn b-teal b-sm" data-hr="${esc(r.id)}">سمعتها</button></div>`}</div>`}).join('')}</div>`:''}

function route(){
  let h=location.hash.slice(1);
  if(h.startsWith('p=')||h.startsWith('t='))store.set('hn_last',h);
  else if(!h&&store.get('hn_last')){h=store.get('hn_last');history.replaceState(null,'','#'+h)}
  if(h.startsWith('p='))return parent(h.slice(2));
  if(h.startsWith('t='))return teacher(h.slice(2));
  if(h==='admin')return admin();
  home();
}
