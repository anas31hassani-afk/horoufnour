.hero>*{position:relative;z-index:1}
.hero p{opacity:.85}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.g2.solo{grid-template-columns:1fr}}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.stat .k{font-size:13px;color:var(--mute)}
.stat .v{font-family:var(--kufi);font-size:24px;font-weight:800;color:var(--teal);line-height:1.3}
.stat .s{font-size:12.5px;color:var(--mute)}
.bar{height:8px;background:var(--linen);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sand));border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.b-teal{background:var(--teal);color:var(--cream)}
.b-sand{background:var(--sand);color:var(--deep)}
.b-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b-wa{background:#25D366;color:#fff}
.b-ghost{background:var(--linen);color:var(--deep)}
.b-sm{padding:7px 11px;font-size:13.5px;border-radius:11px}
.b-bad{background:#fbebeb;color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--linen);color:var(--deep);white-space:nowrap}
.c-ok{background:#e5f4e4;color:var(--ok)}.c-warn{background:#f9eeda;color:var(--warn)}.c-bad{background:#fbebeb;color:var(--bad)}.c-teal{background:#e3efed;color:var(--teal)}
.list{display:grid;gap:10px}
.item{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.item .t{font-weight:700;font-size:16px}
.item .m{color:var(--mute);font-size:13.5px}
.item .acts{margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:62px;background:var(--cream);z-index:10}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--mute);white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--teal);color:var(--cream)}
.tabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--sand);color:var(--deep);font-size:12px;margin-inline-start:6px;padding:0 5px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:700;color:var(--deep)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:15.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;background:#fff}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--cream)}
.seg label:has(input:checked){background:var(--teal);border-color:var(--teal);color:var(--cream)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:30px;line-height:1;color:#d9cfbb;cursor:pointer;padding:0 2px}
.stars button.on{color:var(--sand)}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.sheet{position:fixed;inset:0;background:rgba(13,63,60,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet .box{background:var(--cream);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:24px}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.x{border:0;background:var(--linen);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--cream);padding:11px 18px;border-radius:14px;z-index:80;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:92vw}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.load{display:grid;place-items:center;min-height:50vh;color:var(--mute)}
.spin-s{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
body.busy::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:99;background:linear-gradient(90deg,transparent,var(--sand),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:bb 1s linear infinite}
@keyframes bb{from{background-position:-50% 0}to{background-position:150% 0}}
[data-busy]{opacity:.7;pointer-events:none}
.spin{width:34px;height:34px;border:3px solid var(--linen);border-top-color:var(--teal);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.qmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.qmap div{border-radius:10px;padding:6px 4px;text-align:center;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:12px;line-height:1.35;min-height:46px}
.qmap div b{display:block;font-size:10.5px;color:var(--mute);font-weight:500}
.qmap .done{background:var(--teal);color:var(--cream);box-shadow:none}
.qmap .done b{color:rgba(251,246,236,.7)}
.qmap .cur{background:#fff6e3;box-shadow:inset 0 0 0 2px var(--sand)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:8px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.rep{border-right:3px solid var(--sand);padding:12px 14px;background:#fff;border-radius:14px}
.rep .d{font-size:13px;color:var(--mute)}
.rep .l{margin-top:4px}
.rep .stars-s{color:var(--sand);letter-spacing:2px}
.muted{color:var(--mute)}
.small{font-size:13.5px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;background:#fff;margin-bottom:12px;font-size:15.5px}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}
table.t th,table.t td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:14.5px}
table.t th{background:var(--linen);font-family:var(--kufi);font-size:13px}
.home{max-width:520px;margin:0 auto;text-align:center;padding:40px 18px}
.home .lg{height:120px;width:auto;margin:0 auto 18px;display:block}
audio{width:100%;margin-top:8px}
.ans{display:grid;gap:4px;margin-top:8px;font-size:14px}
.ans div{display:flex;gap:8px}.ans span:first-child{color:var(--mute);min-width:120px}
.pb{padding-bottom:96px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -1px 0 var(--line),0 -10px 30px -20px rgba(13,63,60,.4);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{border:0;background:none;padding:9px 2px 8px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer}
.bnav button svg{width:22px;height:22px}.bnav button.on{color:var(--teal)}
@media(min-width:900px){.bnav{max-width:620px;margin:0 auto 14px;border-radius:20px}}
.v.big{font-family:var(--kufi);font-size:30px;font-weight:800;color:var(--teal)}
.flame{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--linen);color:#c9bfa9}.flame svg{width:28px;height:28px}.flame.on{background:#fff2d6;color:#E08A1E}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:12px}.dots i{height:10px;border-radius:4px;background:var(--linen)}.dots i.on{background:var(--teal)}
.ctrl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ctrl label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--mute)}
.ctrl select,.f3 select,.f3 input{border:1.5px solid var(--line);border-radius:11px;padding:8px;background:#fff;font-size:15px;width:100%}
.mushaf{background:#fff;border-radius:20px;padding:22px 18px;font-family:'Amiri Quran','Amiri',serif;font-size:27px;line-height:2.25;text-align:justify;box-shadow:0 1px 0 var(--line)}
.mushaf .ay{cursor:pointer;border-radius:8px;padding:2px 2px;transition:background .2s}.mushaf .ay.now{background:#fff2d6}
.mushaf .an{color:var(--sand-d);font-size:.8em}
.mushaf .bsm{text-align:center;color:var(--teal);margin-bottom:8px}
.mushaf.hid .ay{color:transparent;background:linear-gradient(var(--linen),var(--linen)) 0 60%/100% 40% no-repeat}.mushaf.hid .ay .an{color:var(--sand-d)}.mushaf.hid .ay.peek{color:var(--ink);background:#fff6e3}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sgrid button{border:0;background:#fff;border-radius:14px;padding:12px 8px;box-shadow:0 1px 0 var(--line);font-family:var(--kufi);font-size:15px;cursor:pointer;display:grid;gap:2px}
.sgrid b{font-family:var(--body);font-size:12px;color:var(--sand-d)}.sgrid small{font-family:var(--body);color:var(--mute);font-size:12px}
.segbar{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:14px;padding:4px;box-shadow:0 1px 0 var(--line)}
.segbar button{border:0;background:none;padding:10px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--mute)}.segbar button.on{background:var(--teal);color:var(--cream)}
.dk{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line);cursor:pointer;user-select:none;transition:opacity .2s}
.dk .dt{font-family:'Amiri',serif;font-size:21px;line-height:1.9}
.dk .cnt{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--cream);font-weight:800;font-size:18px}
.dk.done{opacity:.55}.dk.done .cnt{background:var(--ok)}
.dk summary{cursor:pointer;font-weight:700;color:var(--teal)}
.recbox{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.recb{width:64px;height:64px;border-radius:50%;border:0;background:var(--teal);color:var(--cream);display:grid;place-items:center;cursor:pointer;flex:none}.recb svg{width:28px;height:28px}.recb.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(181,69,47,.18)}}
.upbar{height:6px;border-radius:9px;background:rgba(21,94,90,.12);overflow:hidden;display:none;margin-top:10px}.upbar.show{display:block}.upbar i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--teal),var(--sand));transition:width .3s}
.daypick{display:flex;flex-wrap:wrap;gap:6px}.daypick label{border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13.5px;cursor:pointer;background:#fff}.daypick label:has(input:checked){background:var(--teal);color:var(--cream);border-color:var(--teal)}.daypick input{display:none}
@media print{.bnav{display:none!important}}
@media print{.top,.tabs,.acts,.btn{display:none!important}body{background:#fff}}
/* ===== الاستوديو (الإدارة والمعلم): واجهة داكنة هادئة ===== */
:root{--gold:#E6BC6A;--s1:#fff;--s2:#fff;--s3:var(--linen)}
body.studio{--ink:#EEE8DA;--mute:rgba(238,232,218,.58);--line:rgba(238,232,218,.1);--linen:#1D3230;--s0:#091312;--s1:#0F1D1C;--s2:#142625;--s3:#1B302E;background:var(--s0);color:var(--ink);color-scheme:dark}
body.studio .top{background:rgba(9,19,18,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background-image:none;border-bottom:1px solid var(--line)}
body.studio .top .in{max-width:1240px}
body.studio .top .b-line{color:var(--ink)}
body.studio a:not(.btn){color:var(--gold)}
body.studio .card,body.studio .item,body.studio .stat,body.studio .rep,body.studio table.t{background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
body.studio .sheet .card,body.studio .sheet .item,body.studio .sheet .rep,body.studio .sheet .blk{background:var(--s2)}
body.studio .rep{border-right:3px solid var(--gold)}
body.studio .stat .v{color:var(--ink)}
body.studio h2{font-size:14px;color:var(--mute);font-family:var(--body);font-weight:800;letter-spacing:.3px}
body.studio .field label{color:var(--ink)}
body.studio .field input,body.studio .field select,body.studio .field textarea,body.studio .search,body.studio select,body.studio input[type=month],body.studio .f3 select,body.studio .f3 input{background:var(--s2);border-color:var(--line);color:var(--ink)}
body.studio .sheet .field input,body.studio .sheet .field select,body.studio .sheet .field textarea,body.studio .sheet .search{background:var(--s0)}
body.studio .field input:focus,body.studio .field select:focus,body.studio .field textarea:focus,body.studio .search:focus{border-color:var(--gold)}
body.studio .btn{border-radius:99px}
body.studio .b-teal{background:#F3EDE0;color:#0B1514}
body.studio .b-ghost{background:var(--s3);color:var(--ink)}
body.studio .b-line{border-color:var(--line);color:var(--ink)}
body.studio .b-bad{background:rgba(229,115,92,.13);color:#F29A86}
body.studio .chip{background:var(--s3);color:var(--ink)}
body.studio .c-ok{background:rgba(88,190,140,.14);color:#86D9AF}
body.studio .c-warn{background:rgba(230,188,106,.15);color:var(--gold)}
body.studio .c-bad{background:rgba(229,115,92,.15);color:#F29A86}
body.studio .c-teal{background:rgba(64,180,170,.15);color:#7FD6CC}
body.studio .seg label,body.studio .daypick label{background:var(--s0);border-color:var(--line)}
body.studio .seg label:has(input:checked),body.studio .daypick label:has(input:checked){background:#F3EDE0;color:#0B1514;border-color:#F3EDE0}
body.studio .sheet{background:rgba(0,0,0,.62)}
body.studio .sheet .box{background:var(--s1);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
body.studio .x{background:var(--s3);color:var(--ink)}
body.studio table.t th{background:var(--s2)}
body.studio table.t td,body.studio table.t th{border-color:var(--line)}
body.studio .spin{border-color:var(--s3);border-top-color:var(--gold)}
body.studio .toast{background:#F3EDE0;color:#0B1514}
body.studio .stars button{color:#3a4a48}body.studio .stars button.on{color:var(--gold)}body.studio .seg input:checked+span{color:#0B1514}
body.studio .home .card{text-align:right}
@media(min-width:900px){body.studio .sheet{justify-content:flex-end;align-items:stretch}body.studio .sheet .box{max-width:520px;max-height:none;height:100%;border-radius:0;animation:dr .22s ease}}
@keyframes dr{from{transform:translateX(-36px);opacity:0}}
.sheet.na,.sheet.na .box{animation:none!important}
.sheet .hd{gap:8px}.sheet .hd h3{flex:1;min-width:0}
.dn{display:flex;align-items:center;gap:4px}.dn span{min-width:36px;text-align:center}
.x:disabled{opacity:.3;cursor:default}
/* هيكل الصفحة: قائمة جانبية على الحاسوب، شريط سفلي على الهاتف */
.shell{max-width:1240px;margin:0 auto;padding:20px 18px 110px}
.shell.solo{max-width:880px;padding-bottom:40px}

.pnow .lbl{color:var(--sand)}
.pnow h2{margin:8px 0 2px;font-size:clamp(20px,5.2vw,27px);color:var(--cream)}
.pnow p{opacity:.82;font-size:14.5px}
.pnow.live{background-color:#0F4A45;box-shadow:0 0 0 3px var(--sand)}
.b-light{background:var(--cream);color:var(--deep)}
.b-glass{background:rgba(251,246,236,.12);color:var(--cream)}
.pgrid{display:grid;gap:12px;margin-top:12px}
@media(min-width:720px){.pgrid{grid-template-columns:1fr 1fr}}
.rep.flat{border:0;padding:6px 0 0;background:none;box-shadow:none}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.mini .stat{padding:12px}.mini .v{font-size:21px}.mini .k{font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:18px;padding:16px;border:0;box-shadow:0 1px 0 var(--line),0 10px 30px -22px rgba(13,63,60,.4);text-align:start;cursor:pointer;display:grid;gap:4px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15.5px;font-family:inherit}
.tile svg{width:26px;height:26px;color:var(--teal);margin-bottom:4px}.tile small{font-weight:400;color:var(--mute);font-size:12.5px}
.bnav.b4{grid-template-columns:repeat(4,1fr)}
/* ===== بوابة الدخول ===== */
.portal{max-width:560px;margin:0 auto;padding:28px 18px 40px;text-align:center}
.portal .lg{height:104px;width:auto;margin:0 auto 14px;display:block}
.portal h1{font-size:clamp(22px,5.5vw,28px)}
.portal .card{text-align:right}
.roles{display:grid;gap:10px}
.role{display:grid;grid-template-columns:52px 1fr;column-gap:14px;row-gap:2px;align-items:center;text-align:start;background:#fff;border:0;border-radius:20px;padding:16px;box-shadow:0 1px 0 var(--line),0 12px 30px -22px rgba(13,63,60,.45);cursor:pointer;font-family:inherit;color:var(--ink);text-decoration:none;transition:transform .15s}
.role:active{transform:scale(.98)}
.role .ri{grid-row:1/3;width:52px;height:52px;border-radius:16px;background:var(--teal);color:var(--cream);display:grid;place-items:center}.role .ri svg{width:26px;height:26px}
.role b{font-family:var(--kufi);font-size:17px;line-height:1.4}.role small{color:var(--mute);font-size:13px}
.role.adm{padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line);background:transparent}.role.adm .ri{background:var(--linen);color:var(--deep);width:40px;height:40px;border-radius:12px}.role.adm b{font-size:15px}
.acc{display:flex;gap:8px}.acc .btn:first-child{flex:1}
.otp{letter-spacing:8px;font-size:22px!important;text-align:center;font-family:system-ui,sans-serif}
/* ===== غرفة الحصة داخل التطبيق ===== */
.classroom{position:fixed;inset:0;z-index:45;background:#071010;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.cr-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#EEE8DA;background:#0F1D1C;border-bottom:1px solid rgba(238,232,218,.1)}
.cr-bar b{flex:1;font-family:var(--kufi);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-dot{width:9px;height:9px;border-radius:50%;background:#E5735C;box-shadow:0 0 0 4px rgba(229,115,92,.2);animation:pulse 1.6s infinite}
.classroom iframe{flex:1;width:100%;border:0;background:#071010}
.cr-bar .b-bad{background:rgba(229,115,92,.16);color:#F29A86;border-radius:99px}

/* ولي الأمر: مبدّل الإخوة، الاعتذار، الدفع */
.famsw{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.famsw button{border:1.5px solid var(--line);background:#fff;color:var(--teal);border-radius:99px;padding:7px 15px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.famsw button.on{background:var(--teal);color:var(--cream);border-color:var(--teal)}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.pnow .lnk{display:inline-block;margin-top:12px;font-size:14px;opacity:.9}
.pm{cursor:pointer;margin-bottom:8px;transition:box-shadow .2s}
.pm.on{box-shadow:inset 0 0 0 2px var(--teal)}
.lngsw{display:flex;gap:8px;justify-content:center;margin-top:22px}
.lngsw button{border:1.5px solid var(--line);background:#fff;color:var(--teal);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.lngsw button.on{background:var(--teal);color:var(--cream);border-color:var(--teal)}
.qn{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qn button{border:1px solid var(--line);background:none;color:inherit;opacity:.85;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.lngsw.mini{justify-content:flex-end;margin:0 0 8px}.lngsw.mini button{padding:3px 10px;font-size:12px;border-width:1px}

function sheet(title,html,onMount,nav,onClose){

  let moving=false;
  const close=()=>{if(!s.isConnected)return;s.remove();if(!document.querySelector('.sheet'))document.body.style.overflow='';if(!moving&&onClose)onClose()};
  s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-cl]'))return close();const nv=e.target.closest('[data-nv]');if(nv&&!nv.disabled&&nav){moving=true;close();sheet._na=true;nav.go(nav.i+ +nv.dataset.nv)}});

}

/* memorized surahs from "78-114, 1" + completed sessions */
function memSet(mem,sessions){
  const set=new Set();
  String(mem||'').split(/[,،\s]+/).forEach(p=>{const m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)return;let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];for(let i=Math.max(1,a);i<=Math.min(114,b);i++)set.add(i)});
  (sessions||[]).forEach(s=>{if(s.completedSurah&&+s.surah)set.add(+s.surah)});
  return set;
}

، أعتقه اللَّه من النار","s":"أخرجه أبو داود، 4/ 317، برقم 5069، والبخاري في الأدب المفرد، برقم 1201، والنسائي في عمل اليوم والليلة، برقم 9، وابن السني، برقم 70، وحسّن سماحة الشيخ ابن باز ‘ إسناد النسائي، وأبي داود، في تحفة الأخيار، ص23.","y":2},{"t":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"من قالها حين يصبح فقد أدَّى شكر يومه، ومن قالها حين يمسي فقد أدَّى شكر ليلته","s":"أخرجه أبو داود، 4/ 318، برقم 5073، والنسائي في عمل اليوم والليلة، برقم 7، وابن السني، برقم 41، وابن حبان، ((موارد)) برقم 2361، وحسّن ابن باز ‘ إسناده في تحفة الأخيار، ص24.","y":1},{"t":"اللَّهم ما أمسى بي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"من قالها حين يصبح فقد أدَّى شكر يومه، ومن قالها حين يمسي فقد أدَّى شكر ليلته","s":"أخرجه أبو داود، 4/ 318، برقم 5073، والنسائي في عمل اليوم والليلة، برقم 7، وابن السني، برقم 41، وابن حبان، ((موارد)) برقم 2361، وحسّن ابن باز ‘ إسناده في تحفة الأخيار، ص24.","y":2},{"t":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ، لاَ إِلَهَ إِلاَّ أَنْتَ","c":3,"cd":"ثَلَاثُ مَرَّاتٍ","f":"","s":"أبو داود، 4/ 324، برقم 5090، وأحمد، 5/ 42، برقم 20430، والنسائي في عمل اليوم والليلة، برقم 22، وابن السني، برقم 69، والبخاري في الأدب المفرد، برقم 701، وحسّن العلامة ابن باز ‘ إسناده في تحفة الأخيار، ص26.","y":0},{"t":"حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","c":7,"cd":"سَبعُ مَرَّاتٍ","f":"من قالها حين يصبح وحين يمسي سبع مرات كفاه اللَّه ما أهمّه من أمر الدنيا والآخرة","s":"أخرجه ابن السني، برقم 71 مرفوعاً، وأبو داود موقوفاً، 4/ 321، برقم 5081، وصحّح إسناده شعيب وعبدالقادر الأرناؤوط. انظر: زاد المعاد 2/376.","y":0},{"t":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ: فِي دِينِي وَدُنْيَايَ وَأَهْلِي، وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَينِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"أبو داود، برقم 5074، وابن ماجه، برقم 3871، وانظر: صحيح ابن ماجه، 2/332.","y":0},{"t":"اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطانِ وَشَرَكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"الترمذي، برقم 3392، وأبو داود، برقم 5067،. وانظر: صحيح الترمذي، 3/142.","y":0},{"t":"بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلاَ فِي السّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","c":3,"cd":"ثَلَاثُ مَرَّاتٍ","f":"من قالها ثلاثاً إذا أصبح، وثلاثاً إذا أمسى لم يضره شيء","s":"أخرجه أبو داود، 4/ 323، برقم، 5088، والترمذي، 5/ 465، برقم 3388، وابن ماجه، برقم 3869، وأحمد، برقم 446. وانظر: صحيح ابن ماجه، 2/332، وحسّن إسناده العلامة ابن باز ‘ في تحفة الأخيار، ص39.","y":0},{"t":"رَضِيتُ بِاللَّهِ رَبَّاً، وَبِالْإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ ﷺ نَبِيًّا","c":3,"cd":"ثَلَاثُ مَرَّاتٍ","f":"من قالها ثلاثاً حين يصبح وثلاثاً حين يمسي كان حقاً على اللَّه أن يرضيه يوم القيامة","s":"أحمد، 4/ 337، برقم 18967، والنسائي في عمل اليوم والليلة، برقم 4، وابن السني، برقم 68، وأبو داود، 4/ 318، برقم 1531، والترمذي، 5/ 465، برقم، 3389، وحسّنه ابن باز ‘ في تحفة الأخيار ص39.","y":0},{"t":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغيثُ أَصْلِحْ لِي شَأْنِيَ كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","c":1,"cd":"مَرَّةٌ وَاحِدَةٌ","f":"","s":"الحاكم وصححه، ووافقه الذهبي، 1/545، وانظر: صحيح الترغيب والترهيب، 1/273. function tzOffset(ms,tz){try{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms));const g=t=>+p.find(x=>x.type===t).value;return Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'),g('second'))-ms}catch(e){return 0}}
function zonedMs(y,m,d,hh,mm,tz){const guess=Date.UTC(y,m-1,d,hh,mm);let off=tzOffset(guess,tz);let ms=guess-off;const off2=tzOffset(ms,tz);if(off2!==off)ms=guess-off2;return ms}
function nextClasses(days,time,tz,n=3){
  if(!days||!time)return[];tz=tz&&tz.includes('/')?tz:Intl.DateTimeFormat().resolvedOptions().timeZone;
  const want=String(days).split(',').map(x=>DAYJS[x.trim()]).filter(x=>x!==undefined);if(!want.length)return[];
  const [hh,mm]=String(time).split(':').map(Number);const out=[];const now=Date.now();
  for(let k=0;k<21&&out.length<n;k++){const base=new Date(now+k*864e5);const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(base);const g=t=>p.find(x=>x.type===t).value;
    const wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[g('weekday')];if(!want.includes(wd))continue;const ms=zonedMs(+g('year'),+g('month'),+g('day'),hh,mm,tz);if(ms>now-30*6e4&&!out.includes(ms))out.push(ms)}
  return out.sort((a,b)=>a-b);
}

function icsFor(events,name){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//horoufnour//app//AR','CALSCALE:GREGORIAN','X-WR-CALNAME:'+name];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  events.forEach((e,i)=>{L.push('BEGIN:VEVENT','UID:hn-'+Date.now()+'-'+i+'@horoufnour','DTSTAMP:'+stamp,`DTSTART;TZID=${e.tz}:${e.start}`,'DURATION:'+(e.dur||'PT30M'),'RRULE:'+e.rrule,'SUMMARY:'+e.title,'DESCRIPTION:'+(e.desc||'').replace(/\n/g,'\\n'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e.title,'TRIGGER:-PT'+(e.before||15)+'M','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function firstDate(days,tz){const ms=nextClasses(days,'00:01',tz,1)[0]||Date.now();const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ms));return p.replace(/-/g,'')}
function downloadFile(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function classEvent(st,title){const tz=st.tz&&st.tz.includes('/')?st.tz:Intl.DateTimeFormat().resolvedOptions().timeZone;const [hh,mm]=String(st.time).split(':');return{tz,start:firstDate(st.days,tz)+'T'+hh.padStart(2,'0')+mm.padStart(2,'0')+'00',rrule:'FREQ=WEEKLY;BYDAY='+st.days,title,desc:'حصة القرآن مع أكاديمية حروف من نور — '+base()}}
function addMin(st,m){const d=new Date(Date.UTC(+st.slice(0,4),+st.slice(4,6)-1,+st.slice(6,8),+st.slice(9,11),+st.slice(11,13)+m));return d.toISOString().replace(/[-:]/g,'').slice(0,15)}
function gcalLink(e){return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+e.start+'/'+addMin(e.start,e.min||30)+'&ctz='+encodeURIComponent(e.tz)+'&recur='+encodeURIComponent('RRULE:'+e.rrule)+'&details='+encodeURIComponent(e.desc)}

/* streak from practice dates */
function streakInfo(practice,today){
  const set=new Set(practice.filter(p=>p.kind==='wird').map(p=>p.date));
  let n=0,d=new Date(today+'T12:00:00Z');if(!set.has(today))d.setUTCDate(d.getUTCDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setUTCDate(d.getUTCDate()-1)}
  const last14=[];for(let i=13;i>=0;i--){const x=new Date(today+'T12:00:00Z');x.setUTCDate(x.getUTCDate()-i);const k=x.toISOString().slice(0,10);last14.push([k,set.has(k)])}
  return{n,doneToday:set.has(today),last14,adh:new Set(practice.filter(p=>p.kind!=='wird'&&p.date===today).map(p=>p.kind))};
}

/* audio engine */
const PL={audio:new Audio(),list:[],i:0,rep:1,cnt:0,loops:1,lc:0,rec:'',rate:1,on:false,cb:null,
  start(list,i=0){this.list=list;this.i=i;this.cnt=0;this.lc=0;this.on=true;this.play()},
  play(){const it=this.list[this.i];if(!it){this.stop();return}this.audio.src=ayahUrl(this.rec,it[0],it[1]);this.audio.playbackRate=this.rate;this.audio.play().catch(()=>{});this.cb&&this.cb(this.i,true);const nx=this.list[this.i+1];if(nx){const p=new Audio();p.preload='auto';p.src=ayahUrl(this.rec,nx[0],nx[1])}},
  next(){this.cnt++;if(this.cnt<this.rep){this.play();return}this.cnt=0;this.i++;if(this.i>=this.list.length){this.lc++;if(this.loops===0||this.lc<this.loops){this.i=0}else{this.stop();return}}this.play()},
  stop(){this.on=false;this.audio.pause();this.cb&&this.cb(-1,false)},
  toggle(){if(this.on){this.stop()}else if(this.list.length){this.start(this.list,Math.max(0,this.i<this.list.length?this.i:0))}}};
PL.audio.addEventListener('ended',()=>PL.on&&PL.next());
PL.audio.addEventListener('error',()=>{if(PL.on){toast('تعذّر تحميل الصوت، تحقق من الإنترنت');PL.stop()}});

let ADK=null;
function pAdhkar(p){
  if(!ADK){const h=new Date().getHours();ADK={kind:h>=3&&h<14?'morning':'evening',left:{}}}
  const kind=ADK.kind,items=ADHKAR.map((x,i)=>Object.assign({i},x)).filter(x=>x.y===0||(kind==='morning'?x.y===1:x.y===2));
  const key=kind+PD.today;if(!ADK.left[key])ADK.left[key]=items.map(x=>x.c);const left=ADK.left[key];
  const sk=streakInfo(PD.practice,PD.today),doneK=sk.adh.has(kind);
  const total=items.reduce((a,x)=>a+x.c,0),rem=left.reduce((a,b)=>a+b,0);
  p.innerHTML=`<div class="segbar"><button data-k="morning" class="${kind==='morning'?'on':''}">أذكار الصباح</button><button data-k="evening" class="${kind==='evening'?'on':''}">أذكار المساء</button></div>
  <div class="card mt"><div class="row" style="justify-content:space-between"><b>${doneK?'أتممتها اليوم ✓ بارك الله فيك':'اضغط على الذكر بعد قوله، فينقص العدد'}</b><span class="small muted">${total-rem} من ${total}</span></div><div class="bar"><i style="width:${(total-rem)/total*100}%"></i></div></div>
  <div class="list mt">${items.map((x,k)=>`<div class="dk ${left[k]?'':'done'}" data-k="${k}"><div class="dt">${esc(x.t)}</div><div class="row mt" style="justify-content:space-between"><span class="cnt">${left[k]?left[k]:'✓'}</span><span class="small muted">${esc(x.cd)}</span></div>${x.f||x.s?`<details class="mt small"><summary>الفضل والمصدر</summary>${x.f?`<p class="mt">${esc(x.f)}</p>`:''}${x.s?`<p class="mt muted">${esc(x.s)}</p>`:''}</details>`:''}</div>`).join('')}</div>
  <p class="small muted mt" style="text-align:center">المصدر: حصن المسلم للشيخ سعيد بن علي بن وهف القحطاني.</p>`;
  $$('[data-k]',p).forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>{ADK.kind=b.dataset.k;pAdhkar(p)}});
  $$('.dk',p).forEach(el=>el.addEventListener('click',async ev=>{if(ev.target.closest('details'))return;const k=+el.dataset.k;if(!left[k])return;left[k]--;if(navigator.vibrate)navigator.vibrate(15);
    const c=$('.cnt',el);c.textContent=left[k]||'✓';if(!left[k]){el.classList.add('done');const nx=el.nextElementSibling;nx&&nx.scrollIntoView({block:'center',behavior:'smooth'})}
    if(left.every(v=>!v)&&!doneK){if(await practice(kind)){toast('تقبّل الله منك');pAdhkar(p)}}}));
}

      RMR.start(250);t0=Date.now();$('#rb').classList.add('on');$('#rb').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';$('#rst').textContent='جارٍ التسجيل… اضغط للإيقاف';

    x.onerror=()=>{btn.disabled=false;btn.textContent='أعد المحاولة';toast('تعذّر الإرسال، تحقق من الإنترنت')};x.send(fd)};
}

/* كل حصص طالب بين وقتين (بتوقيت الطالب) */
function occ(st,from,to){
  if(!st||!st.days||!st.time)return[];
  try{const tz=st.tz&&st.tz.includes('/')?st.tz:Intl.DateTimeFormat().resolvedOptions().timeZone;
    const want=String(st.days).split(',').map(x=>DAYJS[x.trim()]).filter(x=>x!==undefined);if(!want.length)return[];
    const [hh,mm]=String(st.time).split(':').map(Number),out=[];
    for(let t=from-864e5;t<=to+864e5;t+=864e5){const p=dtf(tz).formatToParts(new Date(t)),g=k=>p.find(x=>x.type===k).value;
      if(!want.includes({Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[g('weekday')]))continue;
      const ms=zonedMs(+g('year'),+g('month'),+g('day'),hh,mm||0,tz),date=g('year')+'-'+g('month')+'-'+g('day');
      if(ms>=from&&ms<=to&&!out.some(o=>o.ms===ms))out.push({ms,date,st})}
    return out.sort((a,b)=>a.ms-b.ms)}catch(e){return[]}
}

/* الدخول برقم الواتساب + رمز من 6 أرقام (يصل مع رسالة الترحيب أو رابط المعلم) */
function loginSheet(role){
  const t=role==='t';
  sheet(t?'دخول المعلم':'دخول ولي الأمر أو الطالب',`<form id="cf"><p class="small muted">${t?'أدخل رقم الواتساب المسجّل عند الإدارة، والرمز الذي وصلك مع رابط صفحتك.':'أدخلوا رقم الواتساب المسجّل في الأكاديمية، والرمز الذي وصلكم في رسالة الترحيب.'}</p>
  <div class="field mt"><label>رقم الواتساب</label><input name="phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="+212 6…" required></div>
  <div class="field"><label>رمز الدخول (6 أرقام)</label><input name="code" dir="ltr" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required class="otp"></div>
  <p class="small" id="cfE" style="color:var(--bad)"></p>
  <button class="btn b-teal" style="width:100%">دخول</button>
  <div class="row mt" style="justify-content:space-between"><a class="small" target="_blank" rel="noopener" href="${waLink(WA,t?'السلام عليكم، أنا معلم في الأكاديمية وأحتاج رمز الدخول':'السلام عليكم، أحتاج رمز الدخول لتطبيق المتابعة')}">نسيت الرمز؟</a><a class="small" href="${SITE}${t?'#teach':'#book'}">${t?'لست معلماً معنا بعد؟':'ليس عندكم حساب؟'}</a></div></form>`,(box,cl)=>{
    const f=$('#cf',box);f.code.oninput=()=>{f.code.value=f.code.value.replace(/\D/g,'').slice(0,6)};setTimeout(()=>f.phone.focus(),100);
    f.onsubmit=async e=>{e.preventDefault();$('#cfE',box).textContent='';
      try{const r=await api('login',{data:{role,phone:f.phone.value,code:f.code.value}});cl();remember(r.h,r.name,role);location.hash=r.h}
      catch(err){$('#cfE',box).textContent=err.message==='locked'?'محاولات كثيرة. حاول بعد ساعة، أو اطلب الرمز على واتساب.':err.message==='bad'?'اكتب الرقم كاملاً والرمز من 6 أرقام.':'الرقم أو الرمز غير صحيح. تأكد منهما، أو اطلب الرمز على واتساب.'}};
  });
}
/* الحسابات المحفوظة على هذا الجهاز: ولي الأمر يفتح التطبيق فيدخل مباشرة، ومن عنده أكثر من حساب (أو الإدارة) يختار */
const accts=()=>{let a=[];try{a=JSON.parse(store.get('hn_accts')||'[]')}catch(e){}const l=store.get('hn_last');if(l&&!a.some(x=>x.h===l))a.push({h:l,name:'',role:l[0]});return a};
function remember(h,name,role){const a=accts().filter(x=>x.h!==h);a.unshift({h,name,role});store.set('hn_accts',JSON.stringify(a.slice(0,12)));store.set('hn_last',h)}
function forget(h){store.set('hn_accts',JSON.stringify(accts().filter(x=>x.h!==h)));if(store.get('hn_last')===h)store.del('hn_last');const tok=h.slice(2,12);store.del('hn_c_'+h[0]+'_'+tok)}
function switchBtn(){$('#who').innerHTML='<button class="btn b-line b-sm" id="sw" style="color:var(--cream);border-color:rgba(251,246,236,.3)">تبديل الحساب</button>';$('#sw').onclick=()=>{location.hash='home'}}
function route(){
  let h=location.hash.slice(1);
  if(h.startsWith('p=')||h.startsWith('t='))store.set('hn_last',h);
  else if(!h){const a=accts();if(a.length===1&&!store.get('hn_k')){h=a[0].h;history.replaceState(null,'','#'+h)}}
  const dark=h==='admin'||h.startsWith('t=');document.body.classList.toggle('studio',dark);const tc=$('meta[name=theme-color]');if(tc)tc.content=dark?'#091312':'#155E5A';
  if((h.startsWith('p=')?(store.get('hn_lng')==='fr'||store.get('hn_lng')==='en'?store.get('hn_lng'):'ar'):'ar')!==LNG){location.reload();return}
  if(h.startsWith('p='))return parent(h.slice(2));
  if(h.startsWith('t='))return teacher(h.slice(2));
  if(h==='admin')return admin();
  home();
}
addEventListener('hashchange',route);route();trStart();
